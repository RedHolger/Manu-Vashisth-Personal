services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowledger
      POSTGRES_USER: flowledger
      POSTGRES_PASSWORD: flowledger
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
